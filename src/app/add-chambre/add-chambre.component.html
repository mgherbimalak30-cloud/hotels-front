
<div class="container">
  <div>
    <h2>Ajouter une Chambre :</h2>
  </div>

  <form>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Numéro</label>
      <input type="text" [(ngModel)]="newChambre.numeroChambre" name="numeroChambre" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Type</label>
      <input type="text" [(ngModel)]="newChambre.typeChambre" name="typeChambre" class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix par nuit</label>
      <input type="number" [(ngModel)]="newChambre.prixNuit" name="prixNuit" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date d'ajout</label>
      <input type="date" [(ngModel)]="newChambre.dateAjout" name="dateAjout" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Hôtel</label>
      <select class="form-control form-control-lg" id="idHotel" name="idHotel" [(ngModel)]="newIdHotel">
        @for (h of hotels; track h.idHotel) {
        <option [value]="h.idHotel">{{ h.nomHotel }}</option>
        }
      </select>
    </div>

    <div class="mt-2">
      <button type="button" (click)="addChambre()" class="btn btn-success">Ajouter</button>
    </div>
  </form>
</div>
