
<div class="container mt-4">
  <h2>Connexion</h2>

  <form (ngSubmit)="onLoggedin()">
    <div class="mb-3">
      <label for="username" class="form-label">Nom utilisateur :</label>
      <input
        id="username"
        type="text"
        class="form-control"
        name="username"
        [(ngModel)]="user.username"
        required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Mot de passe :</label>
      <input
        id="password"
        type="password"
        class="form-control"
        name="password"
        [(ngModel)]="user.password"
        required>
    </div>

    @if (erreur === 1) {
    <p class="text-danger">Login ou mot de passe erronés.</p>
    }

    <button type="submit" class="btn btn-primary">
      Connexion
    </button>
  </form>
</div>
